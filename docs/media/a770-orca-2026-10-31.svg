<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1800" height="1080" viewBox="0 0 1800 1080" role="img">
  <title id="title">Strata: previous deployed SYCL versus latest Orca L0 on A770</title>
  <desc id="desc">Windows A770 16 GB, 2026-10-31, IQ2_XS, saved profiles, MTP4/spec-min-p=0.8. 48 requests, 3072 generated tokens, 36 retained samples, one A/B/A. Outputs and speculative work differ. Raw PPL worsens while conditional PPL improves; quality equivalence is not established. Short: TTFT 0.804 to 0.697 seconds, latency -13.31%; decode 23.39 to 24.76 tok/s, +5.83%; whole-request throughput +7.53%. Code2K: TTFT 21.635 to 32.763 seconds, latency +51.44%; decode 24.54 to 28.69 tok/s, +16.91%; whole-request throughput -30.77%. Prose2K: TTFT 20.935 to 31.635 seconds, latency +51.11%; decode 22.43 to 26.80 tok/s, +19.50%; whole-request throughput -30.15%. Long8K: TTFT 57.580 to 84.047 seconds, latency +45.96%; decode 23.16 to 29.96 tok/s, +29.39%; whole-request throughput -30.00%. Source: sycl/orca/deployed-versions-a770-windows-2026-10-31.json, SHA256 99bea6cc9d478f3a8e66126f036cde2d1636ddd70819a957e241da5c8894baa4. Linux is unverified.</desc>

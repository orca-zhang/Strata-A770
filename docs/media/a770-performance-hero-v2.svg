<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Strata-A770: code decode 29.02 tok/s, long prefill 596.92 tok/s</title>
  <desc id="desc">2026-10-21 combined retained-optimization build. Five retained medians after warmup: code2048 decode29.02/prefill259.10; prose2048 decode27.87/prefill276.95; long8000 decode24.39/prefill596.92 tok/s. Intel Arc A77016GB,256GiB DDR3,IQ2_XS,spec4,prompt-cache0,max128output. Timings exclude model loading; see README for full ranges and conditions. Historical decode ratios versus7.6/7.0/6.8tok/s: 3.82/3.98/3.59. Long prefill ratio versus239.2tok/s: 2.50. Historical configurations differ;not a controlled software A/B.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Strata-A770: 2K code decode 3.72×, 8K decode 3.37×, 8K prefill 2.08×</title>
  <desc id="desc">Historical stage medians compared with the 2026-10-15 deployed binary: 2K code decode 7.6 to 28.25 tok/s; 8K decode 6.8 to 22.89 tok/s; 8K prefill 239.2 to 497.85 tok/s. Prefill baseline starts at the corrected VRAM-budget stage. Intel Arc A770 16 GB, 256 GiB DDR3 system memory, PCIe 3.0. Inputs and configurations differ; see README for measurement conditions.</desc>
  <defs>
    <radialGradient id="halo" cx="91%" cy="42%" r="85%">
      <stop stop-color="#213721"/><stop offset=".5" stop-color="#101b17"/><stop offset="1" stop-color="#080d10"/>
    </radialGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#14201e" stop-opacity=".75"/><stop offset=".62" stop-color="#17291b" stop-opacity=".55"/><stop offset="1" stop-color="#30471d" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="digits" x1="0" y1="0" x2=".25" y2="1">
      <stop stop-color="#efffd2"/><stop offset=".48" stop-color="#ceff63"/><stop offset="1" stop-color="#9ae53e"/>
    </linearGradient>
    <linearGradient id="arrow"><stop stop-color="#547058"/><stop offset="1" stop-color="#b9e779"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#b8d8b2" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="17"/></filter>
  </defs>
  <rect width="2400" height="1200" fill="#080d10"/>
  <rect width="2400" height="1200" fill="url(#halo)"/>
  <rect width="2400" height="1200" fill="url(#grid)"/>
  <g fill="none" stroke="#b9ed7a">
    <path d="M1700 0L1410 290H2400" stroke-opacity=".05"/>
    <path d="M1950 0L1660 290" stroke-opacity=".05"/>
    <path d="M2210 0L1920 290" stroke-opacity=".05"/>
  </g>
  <g font-family="Bahnschrift, 'Microsoft YaHei', Arial, sans-serif">
    <path d="M112 94h27v27h-27z M152 94h27v27h-27z M112 134h67v16h-67z" fill="#c7ff55"/>
    <text x="204" y="148" fill="#eef5ec" font-size="65" font-weight="700" letter-spacing="5">STRATA <tspan fill="#c7ff55">/ A770</tspan></text>
    <text x="2288" y="115" fill="#d9e5d7" font-size="28" text-anchor="end" letter-spacing="3">INTEL ARC A770 · 16 GB</text>
    <text x="2288" y="158" fill="#8ba18a" font-size="24" text-anchor="end" letter-spacing="3">QWEN3.8-FLASH-NEXT</text>
    <text x="114" y="242" fill="#a3b59f" font-size="29" letter-spacing="3">实测性能进化 <tspan fill="#58715e">/</tspan> MEASURED PERFORMANCE</text>
    <path d="M112 272H2288" stroke="#b4d6a6" stroke-opacity=".18"/>
    <g fill="#93a68d" font-size="24" letter-spacing="2">
      <text x="148" y="321">工作负载 / WORKLOAD</text>
      <text x="1008" y="321" text-anchor="end">历史阶段</text>
      <text x="1580" y="321" text-anchor="end">本轮复测</text>
      <text x="2248" y="321" text-anchor="end" fill="#c7e9a2">提升倍数 / SPEEDUP</text>
    </g>
  </g>
  <g fill="url(#row)" stroke="#a5cd83" stroke-opacity=".12">
    <rect x="112" y="350" width="2176" height="204" rx="10"/>
    <rect x="112" y="574" width="2176" height="204" rx="10"/>
    <rect x="112" y="798" width="2176" height="204" rx="10"/>
  </g>
  <g fill="#c7ff55">
    <rect x="112" y="380" width="5" height="144"/>
    <rect x="112" y="604" width="5" height="144" opacity=".8"/>
    <rect x="112" y="828" width="5" height="144" opacity=".6"/>
  </g>
  <g font-family="Bahnschrift, 'Microsoft YaHei', Arial, sans-serif">
    <g fill="#edf5e8" font-size="53" font-weight="700">
      <text x="152" y="442">2K 代码</text>
      <text x="152" y="666">8K 长上下文</text>
      <text x="152" y="890">8K 预填充</text>
    </g>
    <g fill="#8ba18a" font-size="27" letter-spacing="4">
      <text x="155" y="490">CODE · DECODE</text>
      <text x="155" y="714">LONG · DECODE</text>
      <text x="155" y="938">LONG · PREFILL</text>
    </g>
  </g>
  <g font-family="Impact, 'Arial Narrow', sans-serif" font-size="139" text-anchor="end" fill="#8f9d92">
    <text x="1010" y="506">7.6</text>
    <text x="1010" y="730">6.8</text>
    <text x="1010" y="954">239.2</text>
  </g>
  <g fill="none" stroke="url(#arrow)" stroke-width="6" stroke-linejoin="miter">
    <path d="M1048 456H1122M1096 430L1122 456L1096 482"/>
    <path d="M1048 680H1122M1096 654L1122 680L1096 706"/>
    <path d="M1048 904H1122M1096 878L1122 904L1096 930"/>
  </g>
  <g font-family="Impact, 'Arial Narrow', sans-serif" font-size="160" text-anchor="end" fill="#f0f7e9">
    <text x="1582" y="509">28.25</text>
    <text x="1582" y="733">22.89</text>
    <text x="1582" y="957">497.85</text>
  </g>
  <g font-family="Bahnschrift, Arial, sans-serif" fill="#a8bfa0" font-size="30">
    <text x="1610" y="505">tok/s</text>
    <text x="1610" y="729">tok/s</text>
    <text x="1610" y="953">tok/s</text>
  </g>
  <g stroke="#c7ff55" stroke-opacity=".15">
    <path d="M1778 390V514M1778 614V738M1778 838V962"/>
  </g>
  <g font-family="Impact, 'Arial Narrow', sans-serif" font-size="172" text-anchor="end" fill="#bfff57" opacity=".15" filter="url(#glow)">
    <text x="2245" y="514">3.72×</text>
    <text x="2245" y="738">3.37×</text>
    <text x="2245" y="962">2.08×</text>
  </g>
  <g font-family="Impact, 'Arial Narrow', sans-serif" font-size="172" text-anchor="end" fill="url(#digits)">
    <text x="2245" y="514">3.72×</text>
    <text x="2245" y="738">3.37×</text>
    <text x="2245" y="962">2.08×</text>
  </g>
  <path d="M112 1035H2288" stroke="#8ba86b" stroke-opacity=".35"/>
  <g font-family="Bahnschrift, 'Microsoft YaHei', Arial, sans-serif">
    <text x="115" y="1082" fill="#8ca183" font-size="24" letter-spacing="2">实测平台 / TESTED ON · 256 GiB RAM</text>
    <text x="112" y="1154" fill="#edf5e7" font-size="64" font-weight="700">DDR3 <tspan fill="#668553">+</tspan> PCIe 3.0</text>
    <text x="2286" y="1080" text-anchor="end" fill="#b4c5aa" font-size="26">历史阶段对比 · 非单变量 A/B</text>
    <text x="2286" y="1122" text-anchor="end" fill="#97ac8c" font-size="25">prefill 起点为显存预算修正阶段</text>
    <text x="2286" y="1164" text-anchor="end" fill="#7e9874" font-size="23">Measured medians · See README for conditions.</text>
  </g>
</svg>

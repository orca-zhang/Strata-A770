  <title id="title">Current default vs original HC256: Code decode +21.21–21.64%, Prose +22.89–23.27%; full request +4.15–5.19%</title>
  <desc id="desc">2026-11-08, Intel Arc A770 16GB, Xeon E5-2696 v4, 256 GiB DDR3, Windows 10 22H2. Current Orca L0 U4/min16/M16/HC SG16/spec6/confidence0.6/layer-profile default versus original HC256. Fixed greedy Code2K/Prose2K,2048 input/128 output. Forward old/new/old and independent reverse new/old/new; Short16 then three alternating cycles per process,cycle0 warmup,median cycles1/2,outer geometric times. Decode tok/s=128000/decode_ms; bars use forward rates,labels span both orders,not confidence intervals. 42 requests/4704 tokens,full output and8 fields checked;6 exit codes0,max absolute decode control drift0.150334%. Full request includes prefill and excludes HTTP/startup. No new settings or kernels; no compounded gains. Earlier timing differences,Prose forks and8K low-VRAM flags retained; no repair or cause claimed.</desc>

  <title id="title">Strata-A770 · Orca L0 原生 Level Zero 推理运行时</title>
  <desc id="desc">Same-parameter whole-backend short coding anchor: SYCL 41.42 to Orca 50.54 tok/s, +22.01%. Three independent SYCL/Orca/SYCL processes, ten warmups and five retained per process; 45 complete identical 76-token outputs. Decode excludes preparation and prefill. Independent FP16-pair experiment: Code2K TTFT -14.46%, Long8K -9.36%; not additive. Memory headroom check failed; general quality equivalence and Linux remain unverified. Source sycl/orca/anchor50-a770-windows-2026-10-31.json, SHA256 f6d0a866ae89e7bcca6b249925cc653b669dbbc0ddfc778271b5db5a6613ccc1.</desc>

<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="2000" height="1450" viewBox="0 0 2000 1450" role="img">
  <title id="title">Recommended Orca L0 and WIP Orca Direct: performance comparisons and Windows call paths</title>
  <desc id="desc">Windows A770 16GB, 2026-11-04. Orca L0 is recommended; Orca Direct is a WIP alternative. L0 59.3843 versus independently measured SYCL 42.0545 tok/s: +41.2079% descriptive cross-run reference, not an L0/SYCL bracket. Same-parameter whole-version SYCL/Direct/SYCL: SYCL 42.0545, Direct 58.4840 tok/s (+39.0672%). Includes numerical-kernel, scheduling and cache-policy differences, not an isolated API effect. Independent matched-policy L0 comparisons: Direct 58.3180, L0 59.3843 tok/s (-1.7956%); Direct 58.3002, L0 59.5705 tok/s (-2.1324%). Ten warmups and five retained requests per process; decode excludes preparation and prefill. SYCL uses UR and Level Zero/Intel UMD; Orca L0 uses Level Zero/Intel UMD; Orca Direct encodes GPU commands. All three Windows submission paths use D3DKMT and the kernel driver. Fixed repeated Short28/natural76, not general workload speed. No PPL or Linux GPU conclusion.</desc>

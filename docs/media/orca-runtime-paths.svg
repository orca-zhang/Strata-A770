<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1920" height="425" viewBox="40 665 1920 425" role="img">
  <title id="title">Windows call paths for SYCL, Orca L0 and Orca Direct</title>
  <desc id="desc">SYCL: Strata to SYCL to Unified Runtime to Level Zero/Intel UMD. Current default Orca L0: Strata to Orca L0 to Level Zero/Intel UMD. Orca Direct WIP: Strata to Orca Direct GPU command encoding. All three Windows paths continue through D3DKMT and the Windows kernel driver to Intel GPU. Offline kernel building still uses the Intel compiler. This execution-path diagram makes no speed claim.</desc>
